<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нефтяная компания - Прогноз</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<div class="container">
    <h2>Отправить JSON-запрос</h2>
    <form id="jsonForm">
        <label for="scenarioNumber">Номер сценария:</label>
        <input type="number" id="scenarioNumber" name="scenarioNumber" placeholder="Например: 1" required>

        <label for="drillingRate">Скорость бурения (м/ч):</label>
        <input type="number" step="0.1" id="drillingRate" name="drillingRate" placeholder="Например: 5.5" required>

        <label for="oilPrice">Цена на нефть (USD/баррель):</label>
        <input type="number" step="0.1" id="oilPrice" name="oilPrice" placeholder="Например: 75.3" required>

        <label for="exchangeRate">Курс обмена (RUB/USD):</label>
        <input type="number" step="0.1" id="exchangeRate" name="exchangeRate" placeholder="Например: 74.5" required>

        <button type="button" onclick="sendJsonRequest()">Отправить запрос</button>
    </form>

    <div class="response" id="response"></div>
</div>

<script src="script.js"></script>
</body>
</html>
